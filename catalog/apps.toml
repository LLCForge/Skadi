# Skadi application catalog
#
# Each [[app]] entry describes one application and its package id in every supported package
# manager. Skadi picks the first manager (in preference order) that is available on the user's
# system. Only list package ids you have verified; a wrong id is worse than a missing one.
#
# Many Windows (winget/choco) ids and FOSS flags are adapted from WinUtil
# (https://github.com/ChrisTitusTech/winutil), MIT License. See NOTICE.
#
# Fields:
#   id          lowercase letters, digits and '-' (unique)
#   name        display name
#   category    browsers | communication | development | multimedia | office | security | utilities | gaming | system | self-hosted
#   description { en = "...", tr = "..." }  both languages are required, max 200 characters each
#   homepage    optional, must start with https://
#   foss        optional, true if the app is free and open-source software
#   [app.packages]
#     winget, msstore, choco, scoop                            (Windows)
#     apt, dnf, yum, zypper, pacman, apk, xbps, emerge, eopkg,
#     urpmi, flatpak, snap, nix                                (Linux)
#     brew-cask, brew                                          (macOS)

# --- browsers ----------------------------------------------------------------------------------

[[app]]
id = "brave"
name = "Brave"
category = "browsers"
description = { en = "Chromium-based browser with built-in ad and tracker blocking.", tr = "Reklam ve izleyici engelleyici yerleşik Chromium tabanlı tarayıcı." }
homepage = "https://brave.com/"
foss = true
telemetry = true
privacy_source = "https://github.com/brave/brave-browser/wiki/Operational-Patterns"
note = { en = "Sends privacy-preserving product analytics (P3A) by default; turn off at brave://settings/privacy > Allow privacy-preserving product analytics.", tr = "Varsayılan olarak gizliliği koruyan ürün analitiği (P3A) gönderir; brave://settings/privacy > Allow privacy-preserving product analytics seçeneğinden kapatılabilir." }
alternatives = ["librewolf", "ungoogled"]
[app.packages]
winget = "Brave.Brave"
choco = "brave"
flatpak = "com.brave.Browser"
snap = "brave"
brew-cask = "brave-browser"

