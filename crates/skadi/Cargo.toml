[package]
name = "skadi"
description = "Cross-platform app installer and system debloater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "skadi"
path = "src/main.rs"

[dependencies]
skadi-core.workspace = true
clap.workspace = true
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
serde_json = "1.0.154"
ratatui = { version = "0.29.0", optional = true }
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"], optional = true }
egui_extras = { version = "0.32.3", features = ["image", "file"], optional = true }
image = { version = "0.25.9", default-features = false, features = ["png", "ico"], optional = true }
qrcode = { version = "0.14.1", default-features = false }

[lints]
workspace = true

[features]
default = ["tui", "gui"]
tui = ["dep:ratatui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:image"]
