[[tweak]]
id = "linux-pacman-parallel"
category = "system"
risk = "safe"
name = { en = "Parallel downloads in pacman", tr = "pacman'de paralel indirme" }
description = { en = "Lets pacman download five packages at once; packages are still installed one after another.", tr = "pacman'in aynı anda beş paket indirmesini sağlar; paketler yine sırayla kurulur." }
source = "https://man.archlinux.org/man/pacman.conf.5"

[[tweak.action]]
type = "config-line"
path = "/etc/pacman.conf"
section = "options"
key = "ParallelDownloads"
value = "5"

[[tweak]]
id = "linux-dnf-parallel"
category = "system"
risk = "safe"
name = { en = "More parallel downloads in dnf", tr = "dnf'te daha fazla paralel indirme" }
description = { en = "Lets dnf download up to ten packages at once; packages are still installed one after another.", tr = "dnf'in aynı anda on pakete kadar indirmesini sağlar; paketler yine sırayla kurulur." }
source = "https://dnf.readthedocs.io/en/latest/conf_ref.html"

[[tweak.action]]
type = "config-line"
path = "/etc/dnf/dnf.conf"
section = "main"
key = "max_parallel_downloads"
value = "10"
