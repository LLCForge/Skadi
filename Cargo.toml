[workspace]
resolver = "3"
members = ["crates/skadi-core", "crates/skadi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/LLCForge/Skadi"

[workspace.dependencies]
skadi-core = { path = "crates/skadi-core" }
serde = { version = "1", features = ["derive"] }
toml = "1.2"
sys-locale = "0.3"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
